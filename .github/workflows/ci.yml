name: FaceLit Database CI

on:
  pull_request:
  push:
    branches: [develop, dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liquibase:
    name: PostgreSQL and Liquibase integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      POSTGRES_DB: facelit-db
      POSTGRES_USER: facelit_ci
      POSTGRES_PASSWORD: facelit_ci_only_not_for_production
      POSTGRES_PORT: '5439'
    steps:
      - name: Checkout DB migrations
        uses: actions/checkout@v4

      - name: Prepare migration logs
        run: mkdir -p ci-logs

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Validate Liquibase changelog
        run: docker compose run --rm liquibase validate 2>&1 | tee ci-logs/validate.log

      - name: Apply migrations on clean database
        run: docker compose run --rm liquibase update 2>&1 | tee ci-logs/update.log

      - name: Check pending changesets
        run: docker compose run --rm liquibase status --verbose 2>&1 | tee ci-logs/status.log

      - name: Record migrated schema and seed data
        run: |
          docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --schema-only --no-owner --no-privileges | sed '/^\\restrict /d; /^\\unrestrict /d' > ci-logs/schema-before.sql
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c 'SELECT row_to_json(r) FROM roleandpermission.role r ORDER BY id_role' > ci-logs/roles-before.json
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c 'SELECT count(*) FROM databasechangelog' > ci-logs/changesets-before.txt

      # Exercise the latest expand/contract pair; this is not a full-history rollback.
      - name: Roll back the last two changesets and reapply
        run: |
          docker compose run --rm liquibase rollback-count --count=2 2>&1 | tee ci-logs/rollback.log
          docker compose run --rm liquibase update 2>&1 | tee ci-logs/reapply.log
          docker compose run --rm liquibase validate 2>&1 | tee ci-logs/revalidate.log

      - name: Verify schema and seed preservation after rollback
        run: |
          docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --schema-only --no-owner --no-privileges | sed '/^\\restrict /d; /^\\unrestrict /d' > ci-logs/schema-after.sql
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c 'SELECT row_to_json(r) FROM roleandpermission.role r ORDER BY id_role' > ci-logs/roles-after.json
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c 'SELECT count(*) FROM databasechangelog' > ci-logs/changesets-after.txt
          diff -u ci-logs/schema-before.sql ci-logs/schema-after.sql
          diff -u ci-logs/roles-before.json ci-logs/roles-after.json
          diff -u ci-logs/changesets-before.txt ci-logs/changesets-after.txt

      - name: Capture Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-migration-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Shut down ephemeral database
        if: always()
        run: docker compose down --volumes --remove-orphans
