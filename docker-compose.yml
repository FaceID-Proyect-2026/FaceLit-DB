name: facelit-docker-compose

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facelit-db}
      POSTGRES_USER: ${POSTGRES_USER:-facelit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facelit_password}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-facelit_user} -d ${POSTGRES_DB:-facelit-db}
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    image: shopping-cart-liquibase:5.0.2
    profiles:
      - tooling
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --classpath=/liquibase/liquibase_libs/postgresql-42.7.8.jar
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-facelit-db}
      - --username=${POSTGRES_USER:-facelit_user}
      - --password=${POSTGRES_PASSWORD:-facelit_password}

volumes:
  postgres_data:
